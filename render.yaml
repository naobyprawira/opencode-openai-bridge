services:
  - type: web
    name: opencode-openai-bridge
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BRIDGE_API_KEY
        generateValue: true
      - key: BRIDGE_STATE_DIR
        value: /tmp/opencode-bridge
      - key: BRIDGE_SIGNATURE_MODE
        value: auto
      - key: BRIDGE_SIGNATURE_CHECK_INTERVAL
        value: "86400"
      - key: BRIDGE_UPSTREAM_PROXY
        sync: false
      - key: BRIDGE_UPSTREAM_ROTATE_URL
        sync: false
      - key: BRIDGE_UPSTREAM_ROTATE_TOKEN
        sync: false
